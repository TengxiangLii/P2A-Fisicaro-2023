[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-cluster-isomers-mcp"
version = "0.1.0"
description = "MCP server for the isomer database of Fisicaro et al., Principles of isomer stability in small clusters (Mater. Adv. 2023)."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.0.3",
    "numpy==2.5.3",
]

[project.scripts]
small-cluster-isomers-mcp = "small_cluster_isomers.server:main"
small-cluster-isomers-fetch = "small_cluster_isomers.fetch_minima_data:main"

[tool.setuptools.packages.find]
include = ["small_cluster_isomers*"]
